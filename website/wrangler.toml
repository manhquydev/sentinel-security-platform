# Cloudflare Workers static assets for the Sentinel docs site.
# Build:  cd website && npm ci && npm run build
# Deploy: cd website && npx wrangler deploy
#
# Set the Worker name / account in the Cloudflare dashboard or via CF_ACCOUNT_ID.
name = "sentinel-docs"
compatibility_date = "2026-04-11"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "404-page"
