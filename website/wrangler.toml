# Cloudflare Workers static assets — Sentinel docs site
# Production: https://vinsoc.manhquy.id.vn  (zone manhquy.id.vn)
name = "sentinel-docs"
main = "src/worker.js"
compatibility_date = "2026-04-11"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
# Must run Worker first so charset=utf-8 can be applied to .txt/.md
# (otherwise matching assets bypass the Worker entirely).
run_worker_first = true
not_found_handling = "404-page"

[[routes]]
pattern = "vinsoc.manhquy.id.vn"
custom_domain = true

# New project domain (zone manhquy.io.vn must be active on this Cloudflare account).
# `wrangler deploy` binds this as a Worker Custom Domain and Cloudflare provisions
# the proxied DNS record + SSL automatically.
[[routes]]
pattern = "vinsoc.manhquy.io.vn"
custom_domain = true
