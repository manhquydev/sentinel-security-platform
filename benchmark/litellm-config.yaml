model_list:
  # cheap-sast: the FROZEN DeepSeek comparison arm (V0 baseline, runs 1-2). Kept so that
  # arm stays re-scoreable; no new run uses it. Do not rename or remove — the frozen
  # scorecard is only reproducible through this alias.
  - model_name: cheap-sast
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY

  # Router tiers under test, on the clawcmc agent router.
  #
  # The router defaults to streaming: without an explicit stream:false it answers
  # text/event-stream, which Metis cannot parse. Pinned at the deployment level so no
  # client can forget it.
  #
  # Model family matters here, not just the model. Metis calls /v1/responses
  # (use_responses_api is hardcoded True in openai_compatible.py:72), and only the
  # cx/* family implements it — it returns a real {"object":"response"} with populated
  # usage. Probed and rejected on 2026-07-22, see runs/spike-router-endpoint.md:
  #   ag/gemini-3.5-flash-{low,extra-low}: answer /v1/responses with a chat.completion
  #     object and empty usage -> LiteLLM cannot parse it -> HTTP 500 on every call.
  #   glm/glm-5.2: HTTP 429 on 5/5 probes.
  - model_name: sast-sol
    litellm_params:
      model: openai/cx/gpt-5.6-sol
      api_base: os.environ/ROUTER_API_BASE
      api_key: os.environ/ROUTER_API_KEY
      stream: false

  - model_name: sast-terra
    litellm_params:
      model: openai/cx/gpt-5.6-terra
      api_base: os.environ/ROUTER_API_BASE
      api_key: os.environ/ROUTER_API_KEY
      stream: false

  - model_name: sast-gpt55
    litellm_params:
      model: openai/cx/gpt-5.5
      api_base: os.environ/ROUTER_API_BASE
      api_key: os.environ/ROUTER_API_KEY
      stream: false

  # judge: stronger model for V2 "cheap-model+judge" variant. Placeholder until V2 phase picks a model.
  - model_name: judge
    litellm_params:
      model: os.environ/JUDGE_MODEL
      api_key: os.environ/JUDGE_API_KEY

  # embed: Metis indexing requires embeddings; DeepSeek has none, so this must point at a separate provider.
  # EMBED_MODEL includes the "openai/" LiteLLM-provider prefix so the literal suffix is
  # forwarded as-is to the provider at EMBED_API_BASE.
  #
  # UNUSABLE against the router: it exposes no embedding model, so indexing stays off for
  # the migration (that is the indexing_caveat on every scorecard). The EMBED_* vars were
  # also used as ad-hoc router credentials during the spike, which is a misnomer — router
  # credentials are ROUTER_API_KEY / ROUTER_API_BASE. Leave this alias pointed at a real
  # embeddings provider or leave it unset.
  - model_name: embed
    litellm_params:
      model: os.environ/EMBED_MODEL
      api_key: os.environ/EMBED_API_KEY
      api_base: os.environ/EMBED_API_BASE

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Required for /key/generate (virtual keys) to persist. Local-only Postgres, never exposed beyond 127.0.0.1.
  database_url: os.environ/LITELLM_DATABASE_URL
  # Reject budgeted requests outright if spend can't be verified against the DB, instead of allowing through.
  fail_closed_budget_enforcement: true

litellm_settings:
  # Fail an upstream call rather than hold the client open indefinitely. Without this,
  # a router-side hang blocks the caller with no bound: sol run 1 lost 49.6 minutes to
  # exactly that, with every worker stuck in a read that never returned. A healthy call
  # on these tiers completes in ~12s (38s at the observed maximum), so 120s is far
  # outside normal operation while leaving ample headroom for a slow-but-live request.
  request_timeout: 120
  # Do not persist prompt/response bodies to any logging callback (source code + LLM output must not be retained
  # beyond what the provider itself does under egress).
  turn_off_message_logging: true
  # Never let a virtual key's own value leak into logs/callbacks.
  redact_user_api_key_info: true
  # DeepSeek doesn't support OpenAI's strict json_schema response_format (only json_object);
  # drop unsupported params instead of erroring (discovered via Step-0 spike, 2026-07-21).
  drop_params: true
