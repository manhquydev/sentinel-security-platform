# Client authentication for the DefectDojo external database.
#
# Every TCP connection must be TLS. The explicit reject lines matter: without
# them a client that fails to negotiate TLS falls through to "no matching entry",
# which reports a confusing generic error instead of naming the real cause.
#
# The local socket stays trusted because initdb, the image's own bootstrap phase,
# and pg_isready healthchecks all use it before any TLS listener exists.

# TYPE      DATABASE  USER  ADDRESS       METHOD

local       all       all                 trust

hostssl     all       all   0.0.0.0/0     scram-sha-256
hostssl     all       all   ::/0          scram-sha-256

hostnossl   all       all   0.0.0.0/0     reject
hostnossl   all       all   ::/0          reject
