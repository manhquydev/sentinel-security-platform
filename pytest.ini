# Not the mentor suite. Proof is the two named files in README / week-05 / week-06.
[pytest]
testpaths = tests
pythonpath = .
norecursedirs = .* __pycache__ benchmark workbench evaluation rag website node_modules .venv
addopts =
    --ignore=tests/test_charter_rag.py
    --ignore=tests/test_charter_contracts.py
    --ignore=tests/test_charter_proposal.py
    --ignore=tests/test_charter_trivy.py
    --ignore=tests/test_week1_artifact_normalizer.py
    --ignore=tests/test_week3_aggregate_analysis.py
    --ignore=tests/test_gateway_guardrails.py
    --ignore=tests/test_workbench_phase3_boundary_scripts.py
